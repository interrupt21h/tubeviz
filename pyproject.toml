[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tubeviz"
version = "0.40.0"
description = "AI-directed music visualizer with a searchable local video clip library"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.13,<3",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "librosa==0.11.0",
  "soundfile>=0.13,<1",
  "yt-dlp[default]>=2026.7.4",
  "opencv-python-headless>=4.10,<5",
]

[project.urls]
Homepage = "https://github.com/interrupt21h/tubeviz"
Repository = "https://github.com/interrupt21h/tubeviz.git"
Issues = "https://github.com/interrupt21h/tubeviz/issues"
Changelog = "https://github.com/interrupt21h/tubeviz/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.28,<1",
]

semantic = [
  "open_clip_torch>=3.3,<4",
  "Pillow>=10,<12",
]

render = [
  "playwright>=1.62,<2",
]

audio-ai = [
  "torch>=2.5",
  "transformers>=4.57,<6",
  "nnaudio==0.3.4",
]

[project.scripts]
tubeviz = "tubeviz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tubeviz"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
