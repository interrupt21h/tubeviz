name: Apply cross-renderer effect alignment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-effect-alignment.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align native renderer geometry
        run: |
          set +e
          output=$(python .github/scripts/apply_effect_alignment.py 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ] || ! printf '%s' "$output" | grep -q 'visualizer.js: expected one replacement, found 0'; then
            echo 'Unexpected first-stage patch result' >&2
            exit 1
          fi

      - name: Align browser fallback and scheduling
        run: python .github/scripts/apply_effect_alignment_tail.py

      - name: Run focused regression tests
        run: |
          python -m pip install -e . pytest >/dev/null
          pytest -q tests/test_effect_alignment.py tests/test_editing.py tests/test_render_optimization.py

      - name: Commit aligned effects
        run: |
          git config user.name "Scott Muller"
          git config user.email "scott@21h.io"
          git add src/tubeviz tests/test_effect_alignment.py
          git commit -m "Align radial effects across renderers"
          git push origin HEAD:main
