name: Apply adaptive preview composition optimization

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/preview-composition-perf.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Apply adaptive composition changes
        run: python .github/scripts/apply_preview_composition_perf.py
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Validate full source
        run: |
          pytest -q
          python -m compileall -q src/tubeviz
          node --check src/tubeviz/static/gui.js
          node --check src/tubeviz/static/visualizer.js
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/preview-composition-perf.yml
          rm -f .github/scripts/apply_preview_composition_perf.py
          git add -A
          git commit -m 'Adapt live composition to preview load'
          git fetch origin main
          git rebase origin/main
          pytest -q tests/test_render_optimization.py tests/test_dynamic_effect_choreography.py
          node --check src/tubeviz/static/visualizer.js
          git push origin HEAD:main
