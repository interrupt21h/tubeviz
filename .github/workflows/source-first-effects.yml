name: Apply source-first effect scheduling

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/source-first-effects.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Restore source-first effect scheduling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise RuntimeError(f"expected text not found in {path}: {old[:120]!r}")
              if count is None:
                  text = text.replace(old, new)
              else:
                  text = text.replace(old, new, count)
              write(path, text)

          # Release/version metadata. README intentionally remains untouched.
          for path in (
              "pyproject.toml",
              "src/tubeviz/__init__.py",
              "src/tubeviz/native_src/src/main.cpp",
              "src/tubeviz/static/gui.html",
          ):
              replace(path, "0.40.0", "0.40.1", count=None)

          changelog = read("CHANGELOG.md")
          entry = '''# 0.40.1 — Source-first effect scheduling\n\n- Restore the pre-v0.40 source-first visual balance by making destructive/stylized `VideoTransform` effects true scheduled accents instead of non-zero treatments on nearly every shot. Native/WebGPU parity remains intact; ordinary shots now serialize near-zero/off values and selected accent/hero shots serialize the full effect values.\n- Keep low-impact camera/depth/source-fidelity treatment available continuously, while feedback, glitch, pixelation, RGB displacement, ripple, tunnel, posterization, edge extraction, strobe/shutter, slit-scan, datamosh, block displacement, chroma delay, VHS tracking, trails and slice recursion are occurrence-gated. A small residual is retained only for a few source-safe motion/temporal treatments.\n- Make promoted hero moments explicitly raise the occurrence budget and bias a compatible subset of effects (`subject_echo`, `flow_melt`, `depth_burst`, `time_prism`, `recursive_portal`) without enabling those effects globally.\n- Retune analysis presets around a restrained default: Balanced is source-first, Relaxed/Cinematic are quieter, Dreamy favors controlled temporal continuity, High Energy/EDM deliberately raise accent and hero frequency, and Experimental remains the intentionally aggressive treatment.\n- Retune deterministic CLAP directing and the bounded/whole-song AI prompts so effect availability is not treated as an instruction to use effects. The renderer catalog now labels effects as core, accent or hero; AI is told that empty effect recommendations are valid and that destructive effects belong mainly to builds, peaks, mutations and hero moments.\n- Reduce multiplicative AI amplification of global effect/composition density. User/preset values remain the primary creative budget and AI shapes where that budget is spent rather than silently turning a restrained preset into a dense one.\n- Add regression coverage for source-first defaults, sparse destructive post effects, hero-local effect promotion and the retained High Energy/Experimental escalation.\n\n'''
          if not changelog.startswith("# 0.40.1"):
              write("CHANGELOG.md", entry + changelog)

          # Presets: preserve the v0.40 controls, but make ordinary defaults sparse.
          preset_values = {
              "balanced": {"effect_density": 0.55, "temporal_persistence": 0.70, "composition_diversity": 0.65, "hero_frequency": 0.90},
              "high-energy": {"effect_density": 1.15, "temporal_persistence": 0.90, "composition_diversity": 1.10, "hero_frequency": 1.45},
              "edm": {"effect_density": 1.05, "temporal_persistence": 1.05, "composition_diversity": 1.00, "hero_frequency": 1.40},
              "relaxed": {"effect_density": 0.25, "temporal_persistence": 0.55, "composition_diversity": 0.30, "hero_frequency": 0.45},
              "vibrant": {"effect_density": 0.75, "temporal_persistence": 0.75, "composition_diversity": 0.80, "hero_frequency": 1.00},
              "cinematic": {"effect_density": 0.40, "temporal_persistence": 0.75, "composition_diversity": 0.50, "hero_frequency": 0.75},
              "dreamy": {"effect_density": 0.55, "temporal_persistence": 1.20, "composition_diversity": 0.70, "hero_frequency": 0.80},
              "experimental": {"effect_density": 1.65, "temporal_persistence": 1.35, "composition_diversity": 1.45, "hero_frequency": 1.85},
          }
          path = "src/tubeviz/analysis_presets.py"
          text = read(path)
          preset_ids = list(preset_values)
          for i, preset_id in enumerate(preset_ids):
              marker = f'    "{preset_id}": {{'
              start = text.index(marker)
              next_positions = [text.find(f'    "{other}": {{', start + len(marker)) for other in preset_ids[i + 1:]]
              next_positions = [p for p in next_positions if p >= 0]
              end = min(next_positions) if next_positions else text.index("\n}\n\n\ndef analysis_presets_payload", start)
              block = text[start:end]
              for key, value in preset_values[preset_id].items():
                  pattern = re.compile(rf'("{re.escape(key)}":\s*)[-0-9.]+,')
                  block, n = pattern.subn(lambda m, v=value: f'{m.group(1)}{v:.2f},', block, count=1)
                  if n != 1:
                      raise RuntimeError(f"could not update {preset_id}.{key}")
              text = text[:start] + block + text[end:]
          write(path, text)

          # Source-first defaults for API/CLI/Studio custom mode.
          path = "src/tubeviz/scene_selector.py"
          replace(path, "effect_density: float = 1.0", "effect_density: float = 0.65")
          replace(path, "temporal_persistence: float = 1.0", "temporal_persistence: float = 0.75")
          replace(path, "hero_frequency: float = 1.0", "hero_frequency: float = 0.90")
          replace(path, "composition_diversity: float = 1.0", "composition_diversity: float = 0.70")
          replace(
              path,
              "                comp_diversity *= section.ai_direction.composition_diversity",
              "                comp_diversity *= .60 + .40 * section.ai_direction.composition_diversity",
          )

          path = "src/tubeviz/cli.py"
          for old, new in (
              ('--effect-density\", type=float, default=1.0', '--effect-density\", type=float, default=0.65'),
              ('--temporal-persistence\", type=float, default=1.0', '--temporal-persistence\", type=float, default=0.75'),
              ('--hero-frequency\", type=float, default=1.0', '--hero-frequency\", type=float, default=0.90'),
              ('--composition-diversity\", type=float, default=1.0', '--composition-diversity\", type=float, default=0.70'),
          ):
              replace(path, old, new, count=None)

          path = "src/tubeviz/gui.py"
          for old, new in (
              ('o.get("effect_density", 1.0)', 'o.get("effect_density", 0.65)'),
              ('o.get("temporal_persistence", 1.0)', 'o.get("temporal_persistence", 0.75)'),
              ('o.get("hero_frequency", 1.0)', 'o.get("hero_frequency", 0.90)'),
              ('o.get("composition_diversity", 1.0)', 'o.get("composition_diversity", 0.70)'),
          ):
              replace(path, old, new, count=None)

          # Match the visible initial Studio values to the Balanced preset.
          path = "src/tubeviz/static/gui.html"
          text = read(path)
          for element_id, value in {
              "effectDensity": "0.55",
              "temporalPersistence": "0.70",
              "heroFrequency": "0.90",
              "compositionDiversity": "0.65",
          }.items():
              pattern = re.compile(rf'(id="{element_id}"[^>]*\bvalue=")[^"]+("[^>]*>)')
              text, n = pattern.subn(rf'\g<1>{value}\2', text, count=1)
              if n != 1:
                  raise RuntimeError(f"could not update Studio value {element_id}")
          text = text.replace('<span>sparse 0</span><b>dynamic 1.1–1.7</b><span>relentless 2.5</span>', '<span>sparse 0</span><b>source-first .4–.9</b><span>relentless 2.5</span>')
          text = text.replace('<span>reset 0</span><b>musical .9–1.5</b><span>long memory 2.5</span>', '<span>reset 0</span><b>subtle .5–1.1</b><span>long memory 2.5</span>')
          text = text.replace('<span>consistent 0</span><b>varied 1.1–1.6</b><span>restless 2.5</span>', '<span>consistent 0</span><b>varied .6–1.2</b><span>restless 2.5</span>')
          write(path, text)

          # Native/WebGPU parity remains unchanged. Change only what values get scheduled.
          path = "src/tubeviz/transforms.py"
          replace(path, "density: float = 1.0", "density: float = 0.65")
          replace(
              path,
              '''    advice = selection.ai_consultant or {}\n    preferred.update(_effect_key(v) for v in advice.get("preferred_effects", []) if str(v).strip())\n    try:\n''',
              '''    advice = selection.ai_consultant or {}\n    preferred.update(_effect_key(v) for v in advice.get("preferred_effects", []) if str(v).strip())\n    creative = selection.direction.creative\n    hero_kind = str(getattr(creative, "hero_kind", "") or advice.get("hero_kind") or "").strip().lower().replace("_", " ")\n    hero_preferences = {\n        "subject echo": {"frame echo", "motion trails", "chroma delay"},\n        "flow melt": {"ripple", "motion trails", "vortex"},\n        "depth burst": {"tunnel", "ripple", "edge extraction"},\n        "time prism": {"rgb displacement", "chroma delay", "slit scan"},\n        "recursive portal": {"kaleidoscope", "mirror corridor", "tunnel", "recursive feedback"},\n    }\n    hero_moment = hero_kind in hero_preferences\n    if hero_moment:\n        preferred.update(hero_preferences[hero_kind])\n    try:\n''',
          )
          replace(
              path,
              '''    if section.ai_direction is not None:\n        effect_density = _clamp(effect_density * section.ai_direction.effect_density * advice_bias, 0.0, 2.5)\n        # AI direction modulates a user's global effect ceiling rather than\n''',
              '''    if section.ai_direction is not None:\n        # AI shapes where the user's/preset budget is spent; it does not replace\n        # a restrained global density with its own absolute density.\n        ai_density = _clamp(section.ai_direction.effect_density, 0.0, 2.5)\n        effect_density = _clamp(effect_density * (.55 + .45 * ai_density) * advice_bias, 0.0, 2.5)\n        # AI direction modulates a user's global effect ceiling rather than\n''',
          )
          replace(
              path,
              '''        intensity = _clamp(intensity * ai_scale, 0.0, 2.0)\n    if intensity <= 0.0:\n''',
              '''        intensity = _clamp(intensity * ai_scale, 0.0, 2.0)\n    # Hero promotion increases occurrence probability locally; it never turns a\n    # destructive effect into persistent wallpaper for the rest of the section.\n    event_density = _clamp(effect_density * (1.75 if hero_moment else 1.0), 0.0, 2.5)\n    if intensity <= 0.0:\n''',
          )
          # Existing explicitly-gated legacy effects should also benefit locally from heroes.
          for old, new in (
              ('_density_gate(kaleidoscope_gate, .10, effect_density,', '_density_gate(kaleidoscope_gate, .10, event_density,'),
              ('_density_gate(corridor_gate, .16, effect_density,', '_density_gate(corridor_gate, .16, event_density,'),
              ('_density_gate(mask_gate, .07, effect_density,', '_density_gate(mask_gate, .07, event_density,'),
              ('_density_gate(solarize_gate, .10, effect_density,', '_density_gate(solarize_gate, .10, event_density,'),
              ('_density_gate(vortex_gate, .22, effect_density,', '_density_gate(vortex_gate, .22, event_density,'),
          ):
              replace(path, old, new)
          replace(
              path,
              '''    def accent(name: str, value: float, probability: float, floor: float, *, aliases: tuple[str, ...] = ()) -> float:\n        is_preferred = wants(name, *aliases)\n        gate = _stable_unit(f"{salt}:density:{_effect_key(name)}")\n        if not _density_gate(gate, probability, effect_density, preferred=is_preferred):\n            return value\n        gain = 1.18 + 0.14 * max(0.0, effect_density - 1.0) + (0.18 if is_preferred else 0.0)\n        return _clamp(max(value * gain, floor * min(1.5, intensity)), 0.0, 1.0)\n\n    glitch = accent("horizontal glitch", glitch, .26, .10, aliases=("glitch",))\n''',
              '''    def accent(\n        name: str, value: float, probability: float, floor: float, *,\n        aliases: tuple[str, ...] = (), retain: float = 0.0,\n    ) -> float:\n        is_preferred = wants(name, *aliases)\n        gate = _stable_unit(f"{salt}:density:{_effect_key(name)}")\n        if not _density_gate(gate, probability, event_density, preferred=is_preferred):\n            # This is the key source-first rule: an accent that was not scheduled\n            # is OFF, except for an explicitly tiny residual on source-safe motion\n            # treatments. v0.40 native parity therefore no longer makes every\n            # historical non-zero transform visible continuously.\n            return _clamp(value * max(0.0, min(1.0, retain)), 0.0, 1.0)\n        gain = (\n            1.16 + 0.12 * max(0.0, event_density - 1.0)\n            + (0.18 if is_preferred else 0.0)\n            + (0.30 if hero_moment else 0.0)\n        )\n        return _clamp(max(value * gain, floor * min(1.5, intensity)), 0.0, 1.0)\n\n    feedback = accent("recursive feedback", feedback, .18, .07, aliases=("feedback",), retain=.06)\n    scanlines = accent("scanlines", scanlines, .14, .05, retain=.06)\n    noise = _clamp(noise * (.35 if hero_moment else .15), 0.0, .15)\n    glitch = accent("horizontal glitch", glitch, .26, .10, aliases=("glitch",))\n''',
          )
          for old, new in (
              ('rgb_split = accent("rgb displacement", rgb_split, .28, .08)', 'rgb_split = accent("rgb displacement", rgb_split, .28, .08, retain=.08)'),
              ('ripple = accent("ripple", ripple, .34, .09)', 'ripple = accent("ripple", ripple, .34, .09, retain=.18)'),
              ('frame_echo = accent("frame echo", frame_echo, .32, .10, aliases=("temporal echo",))', 'frame_echo = accent("frame echo", frame_echo, .32, .10, aliases=("temporal echo",), retain=.10)'),
              ('chroma_delay = accent("chroma delay", chroma_delay, .28, .08, aliases=("temporal rgb displacement",))', 'chroma_delay = accent("chroma delay", chroma_delay, .28, .08, aliases=("temporal rgb displacement",), retain=.08)'),
              ('motion_trails = accent("motion trails", motion_trails, .32, .10)', 'motion_trails = accent("motion trails", motion_trails, .32, .10, retain=.12)'),
          ):
              replace(path, old, new)

          # Effect catalog now tells both AI planners how effects should be prioritized.
          path = "src/tubeviz/ai_resources.py"
          text = read(path)
          marker = '\nRASTER_EFFECTS = [item["name"] for item in EFFECT_CATALOG]\n'
          if "EFFECT_TIER_POLICY" not in text:
              policy = '''\n_CORE_EFFECTS = frozenset({\n    "virtual camera", "optical-flow warp", "beat-local deformation",\n    "depth parallax", "background warp", "source-preserving color grade",\n    "source-derived bloom", "source-derived light streaks", "vignette",\n})\n_HERO_TIER_EFFECTS = frozenset({\n    "vortex", "kaleidoscope", "mirror corridor", "solarize",\n    "datamosh", "slice recursion",\n})\nEFFECT_TIER_POLICY = {\n    "core": "May run continuously only at subtle/source-preserving strength.",\n    "accent": "Normally off. Schedule for a specific musical/visual accent, build, transition or peak.",\n    "hero": "Normally off. Reserve for deliberate hero/payoff moments or explicitly experimental treatment.",\n}\nfor _effect in EFFECT_CATALOG:\n    _name = _effect["name"]\n    _tier = "core" if _name in _CORE_EFFECTS else ("hero" if _name in _HERO_TIER_EFFECTS else "accent")\n    _effect["tier"] = _tier\n    _effect["default_policy"] = EFFECT_TIER_POLICY[_tier]\n'''
              if marker not in text:
                  raise RuntimeError("effect catalog marker not found")
              text = text.replace(marker, policy + marker, 1)
              write(path, text)

          # Deterministic semantic directing should make modest recommendations;
          # High Energy/EDM/Experimental escalation comes primarily from the preset.
          path = "src/tubeviz/ai_music_director.py"
          replace(
              path,
              '''    effect_density = min(2.5, max(0.35, 0.65 + 0.85 * section.energy + 0.45 * edit_density + 0.45 * aggressive - 0.35 * dreamy))\n    temporal_persistence = min(2.5, max(0.25, 0.65 + 0.85 * continuity + 0.55 * dreamy + 0.20 * desired_motion - 0.30 * section.percussive_ratio))\n    composition_diversity = min(2.5, max(0.25, 0.60 + 0.75 * desired_complexity + 0.35 * edit_density + 0.30 * aggressive))\n    hero_frequency = min(2.5, max(0.20, 0.45 + 0.65 * section.energy + 0.55 * aggressive + 0.25 * desired_complexity))\n''',
              '''    effect_density = min(1.35, max(0.55, 0.58 + 0.25 * section.energy + 0.20 * edit_density + 0.20 * aggressive - 0.15 * dreamy))\n    temporal_persistence = min(1.45, max(0.45, 0.55 + 0.35 * continuity + 0.35 * dreamy + 0.10 * desired_motion - 0.20 * section.percussive_ratio))\n    composition_diversity = min(1.35, max(0.45, 0.50 + 0.30 * desired_complexity + 0.18 * edit_density + 0.18 * aggressive))\n    hero_frequency = min(1.45, max(0.55, 0.65 + 0.30 * section.energy + 0.35 * aggressive + 0.15 * desired_complexity))\n''',
          )
          replace(path, '    if aggressive > 0.28 or section.vibe in {"fractured", "heavy"}:', '    if aggressive > 0.45 or section.vibe in {"fractured", "heavy"}:')
          replace(
              path,
              '''    if section.percussive_ratio > 0.62:\n        preferred_effects.extend(["slit scan", "strobe"])\n''',
              '''    if section.percussive_ratio > 0.62:\n        preferred_effects.append("slit scan")\n        if section.energy > 0.78 and section.label in {"build", "peak"}:\n            preferred_effects.append("strobe")\n''',
          )
          replace(
              path,
              '''    preferred_composition = (\n        "mosaic" if composition_diversity > 1.55 and desired_complexity > .62\n        else "split" if composition_diversity > 1.30 and edit_density > .58\n        else "flow" if dreamy > .35\n        else None\n    )\n''',
              '''    preferred_composition = (\n        "mosaic" if composition_diversity > 1.22 and desired_complexity > .72 and section.label in {"build", "peak"}\n        else "split" if composition_diversity > 1.08 and edit_density > .68 and section.label in {"build", "peak"}\n        else "flow" if dreamy > .45\n        else None\n    )\n''',
          )
          for old, new in (
              ('"effect_density": 1.4,', '"effect_density": 0.75,'),
              ('"temporal_persistence": 1.2,', '"temporal_persistence": 0.80,'),
              ('"composition_diversity": 1.3,', '"composition_diversity": 0.70,'),
              ('"hero_frequency": 1.1,', '"hero_frequency": 0.90,'),
          ):
              replace(path, old, new)
          replace(
              path,
              '        "Actively shape effect_density (how often effects become visible), temporal_persistence (whether trails/feedback can cross compatible cuts), composition_diversity (how often multi-source layouts evolve), and hero_frequency (rare large transformations). These are independent of amplitude/intensity. "\n',
              '        "Actively shape effect_density (how often effects become visible), temporal_persistence (whether trails/feedback can cross compatible cuts), composition_diversity (how often multi-source layouts evolve), and hero_frequency (rare large transformations). These are independent of amplitude/intensity. Treat source-first as the normal state: core-tier effects may remain subtle, accent-tier effects should be absent on most ordinary shots, and hero-tier effects should normally appear only for deliberate hero/payoff moments. Values around 0.55–0.90 are normal for effect density; use values above 1 primarily for genuinely high-energy drops/builds or intentionally experimental sections. It is valid to recommend no special effect for a shot/section. "\n',
          )

          # The bounded consultant may recommend effects, but ordinary shots should
          # not be turned into dense effect stacks simply because the catalog is rich.
          path = "src/tubeviz/ai_edit_consultant.py"
          replace(path, '"effect_bias": 1.2,', '"effect_bias": 0.75,')
          replace(
              path,
              '        "For each shot, use the exact effect_catalog to judge which effects suit the supplied scene semantics, motion, complexity and the musical moment. preferred_effects must contain catalog names only. effect_bias controls occurrence density for this shot (0.5 restrained, 1 normal, 1.5 assertive), not raw amplitude. "\n',
              '        "For each shot, use the exact effect_catalog and its tier/default_policy to judge which effects suit the supplied scene semantics, motion, complexity and the musical moment. preferred_effects must contain catalog names only, and an empty list is often the correct source-first choice. effect_bias controls occurrence density for this shot (about 0.6–0.9 ordinary, 1 normal, above 1 only for a strong build/peak/hero), not raw amplitude. Core effects may remain subtle; accent effects should be absent on most shots; hero-tier effects should normally accompany an actual hero/payoff decision. "\n',
          )
          replace(
              path,
              '''        try:\n            effect_bias = min(1.75, max(0.25, float(item.get("effect_bias", 1.0))))\n        except (TypeError, ValueError):\n            effect_bias = 1.0\n''',
              '''        try:\n            effect_bias = min(1.75, max(0.25, float(item.get("effect_bias", 0.75))))\n        except (TypeError, ValueError):\n            effect_bias = 0.75\n        if hero is None:\n            effect_bias = min(effect_bias, 1.25 if section.label in {"build", "peak"} else 1.0)\n''',
          )

          # Regression tests for the corrected scheduling policy.
          path = "tests/test_dynamic_effect_choreography.py"
          text = read(path)
          text = text.replace('    assert direction.effect_density > 1.0\n', '    assert .55 <= direction.effect_density <= 1.35\n')
          if "test_source_first_defaults_keep_destructive_post_fx_sparse" not in text:
              text += '''\n\ndef test_source_first_defaults_keep_destructive_post_fx_sparse():\n    assert TransformConfig().density < 1.0\n    assert ANALYSIS_PRESETS['balanced']['parameters']['effect_density'] < 1.0\n    sec = _section(ai_direction=None)\n    names = (\n        'glitch', 'pixelate', 'tunnel', 'posterize', 'edge', 'strobe',\n        'shutter', 'slit_scan', 'datamosh', 'block_displace',\n        'vhs_tracking', 'slice_recursion',\n    )\n    active = total = 0\n    for i in range(64):\n        sel = _selection(i).model_copy(update={'scene_id': i + 100, 'source_id': f'default-{i}', 'motif_id': str(i)})\n        t = plan_transform(sec, sel, TransformConfig(intensity=1.2))\n        active += sum(getattr(t, name) > .01 for name in names)\n        total += len(names)\n    assert active < total * .30\n\n\ndef test_hero_moment_promotes_compatible_accents_without_global_enablement():\n    sec = _section(ai_direction=None)\n    normal_total = hero_total = 0.0\n    names = ('rgb_split', 'chroma_delay', 'slit_scan')\n    for i in range(48):\n        sel = _selection(i).model_copy(update={'scene_id': i + 200, 'source_id': f'hero-{i}', 'motif_id': str(i)})\n        normal = plan_transform(sec, sel, TransformConfig(intensity=1.25, density=.55))\n        creative = sel.direction.creative.model_copy(update={'hero_kind': 'time_prism'})\n        hero_sel = sel.model_copy(update={'direction': sel.direction.model_copy(update={'creative': creative})})\n        hero = plan_transform(sec, hero_sel, TransformConfig(intensity=1.25, density=.55))\n        normal_total += sum(getattr(normal, name) for name in names)\n        hero_total += sum(getattr(hero, name) for name in names)\n    assert hero_total > normal_total\n\n\ndef test_high_energy_and_experimental_raise_effect_budget_over_balanced():\n    balanced = ANALYSIS_PRESETS['balanced']['parameters']\n    high = ANALYSIS_PRESETS['high-energy']['parameters']\n    edm = ANALYSIS_PRESETS['edm']['parameters']\n    experimental = ANALYSIS_PRESETS['experimental']['parameters']\n    assert high['effect_density'] > edm['effect_density'] > balanced['effect_density']\n    assert high['hero_frequency'] > balanced['hero_frequency']\n    assert experimental['effect_density'] > high['effect_density']\n    assert experimental['hero_frequency'] > high['hero_frequency']\n'''
          write(path, text)
          PY

      - name: Install test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate corrected source
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          python -m compileall -q src/tubeviz
          node --check src/tubeviz/static/gui.js
          node --check src/tubeviz/static/visualizer.js

      - name: Commit corrected source and clean temporary refs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/source-first-effects.yml
          git add -A
          git commit -m 'Restore source-first effect scheduling'
          git fetch origin main
          git rebase origin/main
          pytest -q tests/test_dynamic_effect_choreography.py tests/test_analysis_presets.py tests/test_ai_director.py
          git push origin HEAD:main
          git push origin --delete v040-staging >/dev/null 2>&1 || true
          git push origin --delete v040-clean >/dev/null 2>&1 || true
