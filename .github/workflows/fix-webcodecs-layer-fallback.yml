name: Fix WebCodecs layer fallback

on:
  push:
    branches: [fix-webcodecs-layer-fallback]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply per-layer fallback fix
        run: python .github/scripts/fix_webcodecs_layer_fallback.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate
        run: |
          pytest -q
          python -m compileall -q src/tubeviz
          node --check src/tubeviz/static/visualizer.js

      - name: Commit validated source
        run: |
          git add src/tubeviz/static/visualizer.js tests/test_browser_phase2.py
          git config user.name "Scott Muller"
          git config user.email "scott@21h.io"
          git commit -m "Keep WebCodecs fallback per layer"
          git push origin HEAD:fix-webcodecs-layer-fallback
