name: Apply source-first migration

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-source-first-clean.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Apply source-first scheduling
        run: python .github/scripts/apply_source_first.py

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate full source
        run: |
          pytest -q
          python -m compileall -q src/tubeviz
          node --check src/tubeviz/static/gui.js
          node --check src/tubeviz/static/visualizer.js

      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/source-first-effects.yml
          rm -f .github/workflows/apply-source-first-clean.yml
          rm -f .github/scripts/apply_source_first.py
          git add -A
          git commit -m 'Restore source-first effect scheduling'
          git fetch origin main
          git rebase origin/main
          pytest -q tests/test_dynamic_effect_choreography.py tests/test_analysis_presets.py tests/test_ai_director.py tests/test_transforms.py
          git push origin HEAD:main
          git push origin --delete v040-staging >/dev/null 2>&1 || true
          git push origin --delete v040-clean >/dev/null 2>&1 || true
