name: Fix WebGPU external sampler

on:
  push:
    branches: [fix-webgpu-external-sampler]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply WGSL sampler fix
        run: python .github/scripts/fix_webgpu_external_sampler.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate
        run: |
          python -m compileall -q src/tubeviz
          for f in src/tubeviz/static/*.js; do node --check "$f"; done
          python -m pytest -ra --strict-config --strict-markers
          grep -F "@group(0) @binding(4) var layerSampler: sampler;" src/tubeviz/static/browser_gpu_core.js
          grep -F "textureSampleBaseClampToEdge(video0,layerSampler,layerUv(" src/tubeviz/static/browser_gpu_core.js

      - name: Publish validated source through Git data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = "fix-webgpu-external-sampler"
          token = os.environ["GH_TOKEN"]
          paths = [
              "CHANGELOG.md",
              "pyproject.toml",
              "src/tubeviz/__init__.py",
              "src/tubeviz/native_src/src/main.cpp",
              "src/tubeviz/static/browser_gpu_core.js",
              "src/tubeviz/static/browser_gpu_worker.js",
              "src/tubeviz/static/browser_gpu.js",
              "src/tubeviz/static/index.html",
              "src/tubeviz/static/browser_source.js",
              "src/tubeviz/static/gui.html",
              "src/tubeviz/static/visualizer.js",
              "tests/test_browser_phase2.py",
          ]

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          ref = request("GET", f"/git/ref/heads/{branch}")
          parent = ref["object"]["sha"]
          commit = request("GET", f"/git/commits/{parent}")
          entries = []
          for path in paths:
              content = open(path, "rb").read()
              blob = request("POST", "/git/blobs", {
                  "content": base64.b64encode(content).decode(),
                  "encoding": "base64",
              })
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]})
          tree = request("POST", "/git/trees", {"base_tree": commit["tree"]["sha"], "tree": entries})
          new_commit = request("POST", "/git/commits", {
              "message": "Fix WebGPU external texture sampler binding",
              "tree": tree["sha"],
              "parents": [parent],
          })
          request("PATCH", f"/git/refs/heads/{branch}", {"sha": new_commit["sha"], "force": False})
          print(new_commit["sha"])
          PY
