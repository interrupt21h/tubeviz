name: Fix WebGPU and WebCodecs

on:
  push:
    branches: [fix-webgpu-webcodecs]

permissions:
  contents: write

concurrency:
  group: fix-webgpu-webcodecs
  cancel-in-progress: true

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply browser rendering fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def read(path):
              return (ROOT / path).read_text()

          def write(path, text):
              (ROOT / path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          def replace_block(path, start, end, replacement):
              text = read(path)
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f"start marker not found in {path}: {start!r}")
              j = text.find(end, i + len(start))
              if j < 0:
                  raise SystemExit(f"end marker not found in {path}: {end!r}")
              write(path, text[:i] + replacement + text[j:])

          # Bug-fix release/version and browser cache-busters.
          replace_once('pyproject.toml', 'version = "0.42.0"', 'version = "0.42.1"')
          replace_once('src/tubeviz/__init__.py', '__version__ = "0.42.0"', '__version__ = "0.42.1"')
          main = read('src/tubeviz/native_src/src/main.cpp').replace('tubeviz-native-render 0.42.0', 'tubeviz-native-render 0.42.1')
          write('src/tubeviz/native_src/src/main.cpp', main)
          gui = read('src/tubeviz/static/gui.html').replace('?v=0.42.0', '?v=0.42.1')
          write('src/tubeviz/static/gui.html', gui)
          replace_once('src/tubeviz/static/index.html', '<script type="module" src="/static/visualizer.js"></script>', '<script type="module" src="/static/visualizer.js?v=0.42.1"></script>')

          # WGSL regression: angle is mutated in the final beat-warp mode, so it
          # must be mutable. `let` prevents the compositor shader from compiling.
          replace_once(
              'src/tubeviz/static/browser_gpu_core.js',
              '    let angle=a*.24*polarity*(1.0-smoothstep(.05,.88,r));\n    angle+=sin(r*34.0*frequency-localPhase*11.0+variant)*a*.035;',
              '    var angle=a*.24*polarity*(1.0-smoothstep(.05,.88,r));\n    angle+=sin(r*34.0*frequency-localPhase*11.0+variant)*a*.035;',
          )

          # Cache-bust the browser module graph so a fixed shader/worker cannot be
          # paired with a stale 0.42.0 module from an existing Studio tab.
          replace_once('src/tubeviz/static/browser_gpu.js', "import {createGpuRendererCore} from '/static/browser_gpu_core.js';", "import {createGpuRendererCore} from '/static/browser_gpu_core.js?v=0.42.1';")
          replace_once('src/tubeviz/static/browser_gpu.js', "new Worker('/static/browser_gpu_worker.js',{type:'module'})", "new Worker('/static/browser_gpu_worker.js?v=0.42.1',{type:'module'})")
          replace_once('src/tubeviz/static/browser_gpu_worker.js', "import {createGpuRendererCore} from '/static/browser_gpu_core.js';", "import {createGpuRendererCore} from '/static/browser_gpu_core.js?v=0.42.1';")
          visualizer = read('src/tubeviz/static/visualizer.js')
          visualizer = visualizer.replace("from '/static/browser_gpu.js';", "from '/static/browser_gpu.js?v=0.42.1';", 1)
          visualizer = visualizer.replace("from '/static/browser_source.js';", "from '/static/browser_source.js?v=0.42.1';", 1)
          visualizer = visualizer.replace("from '/static/browser_encode.js';", "from '/static/browser_encode.js?v=0.42.1';", 1)
          write('src/tubeviz/static/visualizer.js', visualizer)

          # If postMessage fails before ownership transfers to the worker, close
          # the two newly-created VideoFrames locally rather than relying on GC.
          replace_block(
              'src/tubeviz/static/browser_gpu.js',
              '  render(effectSource,sourceColorSource,params={}){',
              '  resetHistory(){',
              '''  render(effectSource,sourceColorSource,params={}){
    if(this.failed)return false;
    // Live preview may drop a GPU submission if the worker is already behind.
    // This is preferable to growing an unbounded queue and increasing preview latency.
    if(this.inflight>=2)return true;
    let effect=null,source=null;
    try{
      const ts=Math.max(0,Math.round(Number(params.time||0)*1e6));
      effect=new VideoFrame(effectSource,{timestamp:ts});source=new VideoFrame(sourceColorSource,{timestamp:ts});
      const id=++this.seq;this.inflight++;
      const promise=new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>{
          if(!this.pending.has(id))return;
          this.pending.delete(id);this.inflight=Math.max(0,this.inflight-1);this._markFailed(`WebGPU worker frame ${id} timed out`);reject(new Error(this.failureReason));
        },WORKER_FRAME_TIMEOUT_MS);
        this.pending.set(id,{resolve,reject,timer});
      });
      // Avoid an unhandled rejection during live preview if the worker fails between
      // frames. Offline rendering explicitly awaits sync().
      promise.catch(()=>{});this.lastPromise=promise;
      this.worker.postMessage({type:'render',id,effect,source,params},[effect,source]);
      // Ownership transferred successfully; the worker closes both frames.
      effect=null;source=null;return true;
    }catch(error){
      try{effect?.close();}catch(_){}try{source?.close();}catch(_){}
      this._markFailed(error?.message||error);return false;
    }
  }
''',
          )

          # Replace the worker decoder with worker-local capability negotiation.
          # The TVZ2 stream is always High Profile Level 4.2; fallback changes the
          # acceleration preference, never the bitstream codec/profile declaration.
          write('src/tubeviz/static/browser_source_worker.js', r'''// SPDX-License-Identifier: Apache-2.0
// Dedicated sequential WebCodecs source decoder. TVZ2 stores normal-GOP H.264;
// each source decoder advances forward and resets only to the nearest preceding
// IDR on backwards/random timeline access. TVZ1 all-IDR caches remain readable.

const sources = new Map();
function parsePacked(buffer) {
  const bytes = new Uint8Array(buffer);
  if (bytes.byteLength < 12) throw new Error('invalid tubeviz source payload');
  const magic = String.fromCharCode(...bytes.subarray(0, 4));
  if (magic !== 'TVZ1' && magic !== 'TVZ2') throw new Error(`unsupported tubeviz source transport ${magic}`);
  const view = new DataView(buffer), count = view.getUint32(4, true), fps = view.getFloat32(8, true);
  let offset = 12; const units = [];
  for (let i = 0; i < count; i++) {
    let key = true;
    if (magic === 'TVZ2') { if (offset + 5 > bytes.byteLength) throw new Error('truncated source payload'); key = view.getUint8(offset) !== 0; offset++; }
    else if (offset + 4 > bytes.byteLength) throw new Error('truncated source payload');
    const n = view.getUint32(offset, true); offset += 4;
    if (!n || offset + n > bytes.byteLength) throw new Error('truncated source access unit');
    units.push({key, data: bytes.subarray(offset, offset + n)}); offset += n;
  }
  if (!units[0]?.key) throw new Error('source transport does not begin with a key frame');
  return {version: magic === 'TVZ2' ? 2 : 1, fps, units};
}
function nearestKey(s, index) { for (let i = index; i >= 0; i--) if (s.units[i]?.key) return i; return 0; }
function decoderError(error, fallback='source decoder failed') { return error instanceof Error ? error : new Error(String(error || fallback)); }
function rejectWaiters(s, error) {
  const err = decoderError(error);
  for (const waiter of s.waiters?.values?.() ?? []) waiter.reject(err);
  s.waiters?.clear?.();
  if (s.outputIndices) s.outputIndices.length = 0;
}
function configCandidates(config) {
  const base = {...(config || {})};
  const codec = String(base.codec || '');
  if (!codec) return [];
  const raw = [
    base,
    {...base, hardwareAcceleration: 'no-preference'},
    {...base, hardwareAcceleration: 'prefer-software'},
    {codec, optimizeForLatency: true, hardwareAcceleration: 'no-preference'},
    {codec, optimizeForLatency: true},
    {codec},
  ];
  const seen = new Set();
  return raw.filter(item => { const key = JSON.stringify(item); if (seen.has(key)) return false; seen.add(key); return true; });
}
function newDecoder(s) {
  return new VideoDecoder({
    output: frame => {
      const index = s.outputIndices.shift(), waiter = s.waiters.get(index);
      if (waiter) { s.waiters.delete(index); waiter.resolve(frame); } else frame.close();
    },
    error: error => {
      s.error = decoderError(error);
      rejectWaiters(s, s.error);
    },
  });
}
async function createDecoder(s) {
  s.outputIndices = [];
  s.waiters = new Map();
  s.error = null;
  let lastError = null;
  for (const candidate of configCandidates(s.config)) {
    let selected = candidate;
    try {
      if (typeof VideoDecoder.isConfigSupported === 'function') {
        const support = await VideoDecoder.isConfigSupported(candidate);
        if (!support?.supported) continue;
        selected = support.config ?? candidate;
      }
      const decoder = newDecoder(s);
      try { decoder.configure(selected); }
      catch (error) { try { decoder.close(); } catch (_) {} throw error; }
      s.decoder = decoder;
      s.config = selected;
      return;
    } catch (error) { lastError = decoderError(error); }
  }
  throw new Error(`no supported worker VideoDecoder configuration for ${s.config?.codec || 'unknown codec'}: ${lastError?.message || 'unsupported'}`);
}
async function restartAt(s, index) {
  rejectWaiters(s, new Error('source decoder restarted'));
  try { if (s.decoder?.state !== 'closed') s.decoder.close(); } catch (_) {}
  await createDecoder(s); s.decodedThrough = index - 1;
}
async function openSource(m) {
  const response = await fetch(m.url, {cache: 'force-cache'});
  if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
  const packed = parsePacked(await response.arrayBuffer());
  const state = {fps: packed.fps, units: packed.units, version: packed.version, config: m.config, decodedThrough: -1, chain: Promise.resolve(), closed: false};
  await createDecoder(state); sources.set(m.sourceId, state);
  postMessage({type: 'opened', requestId: m.requestId, sourceId: m.sourceId, fps: state.fps, count: state.units.length, version: state.version});
}
async function decodeFrame(s, index) {
  if (s.closed) throw new Error('source decoder closed');
  if (s.error) throw s.error;
  if (index <= s.decodedThrough) await restartAt(s, nearestKey(s, index));
  const framePromise = new Promise((resolve, reject) => s.waiters.set(index, {resolve, reject}));
  const duration = Math.round(1e6 / s.fps);
  try {
    for (let i = s.decodedThrough + 1; i <= index; i++) {
      const unit = s.units[i]; s.outputIndices.push(i);
      s.decoder.decode(new EncodedVideoChunk({type: unit.key ? 'key' : 'delta', timestamp: Math.round(i * 1e6 / s.fps), duration, data: unit.data}));
      s.decodedThrough = i;
      if (s.decoder.decodeQueueSize > 10 && i < index) await s.decoder.flush();
    }
  } catch (error) {
    s.error = decoderError(error);
    rejectWaiters(s, s.error);
    throw s.error;
  }
  return await framePromise;
}
async function frameSource(m) {
  const s = sources.get(m.sourceId); if (!s) throw new Error('source not open');
  const index = Math.max(0, Math.min(s.units.length - 1, Number.isInteger(m.index) ? m.index : Math.round(Math.max(0, Number(m.relativeSeconds) || 0) * s.fps)));
  const work = s.chain.then(() => decodeFrame(s, index));
  s.chain = work.then(() => {}, () => {});
  const frame = await work;
  try { postMessage({type: 'frame', requestId: m.requestId, sourceId: m.sourceId, index, frame}, [frame]); }
  catch (error) { try { frame.close(); } catch (_) {} throw error; }
}
function closeSource(id) {
  const s = sources.get(id); if (!s) return;
  s.closed = true;
  rejectWaiters(s, new Error('source decoder closed'));
  try { if (s.decoder?.state !== 'closed') s.decoder.close(); } catch (_) {}
  sources.delete(id);
}
self.onmessage = async e => {
  const m = e.data || {};
  try {
    if (m.type === 'open') { await openSource(m); return; }
    if (m.type === 'frame') { await frameSource(m); return; }
    if (m.type === 'close') { closeSource(m.sourceId); return; }
    if (m.type === 'close-all') { for (const id of [...sources.keys()]) closeSource(id); return; }
  } catch (error) {
    postMessage({type: 'error', requestId: m.requestId ?? null, sourceId: m.sourceId ?? null, error: String(error?.message || error)});
  }
};
''')

          # Main-thread source facade: only advertise the codec the server actually
          # emits (High Profile L4.2), negotiate acceleration independently, close
          # orphan frames, and detach pending source requests on close.
          source_path = 'src/tubeviz/static/browser_source.js'
          source = read(source_path)
          source = source.replace("new Worker('/static/browser_source_worker.js', {type: 'module'})", "new Worker('/static/browser_source_worker.js?v=0.42.1', {type: 'module'})", 1)
          insert_marker = "let decoderProbePromise = null;\n"
          helper = r'''function decoderConfigCandidates(config = {}) {
  const base = {...config, codec: config.codec || DEFAULT_CODEC};
  const raw = [
    base,
    {...base, hardwareAcceleration: 'prefer-hardware', optimizeForLatency: true},
    {...base, hardwareAcceleration: 'no-preference', optimizeForLatency: true},
    {...base, hardwareAcceleration: 'prefer-software', optimizeForLatency: true},
    {codec: base.codec, optimizeForLatency: true, hardwareAcceleration: 'no-preference'},
    {codec: base.codec, optimizeForLatency: true},
    {codec: base.codec},
  ];
  const seen = new Set();
  return raw.filter(item => { const key = JSON.stringify(item); if (seen.has(key)) return false; seen.add(key); return true; });
}

'''
          if insert_marker not in source:
              raise SystemExit('browser_source probe marker missing')
          source = source.replace(insert_marker, helper + insert_marker, 1)
          old_probe = r'''    const configs = [
      {codec: DEFAULT_CODEC, hardwareAcceleration: 'prefer-hardware', optimizeForLatency: true},
      {codec: 'avc1.4d002a', hardwareAcceleration: 'prefer-hardware', optimizeForLatency: true},
      {codec: 'avc1.42002a', hardwareAcceleration: 'prefer-hardware', optimizeForLatency: true},
    ];
    for (const config of configs) {
      try {
        const support = await VideoDecoder.isConfigSupported(config);
        if (support?.supported) return {supported: true, config: support.config ?? config, codec: config.codec};
      } catch (_) {}
    }
    return {supported: false, reason: 'no supported Annex-B H.264 VideoDecoder configuration'};'''
          new_probe = r'''    // The server emits High Profile Level 4.2 Annex-B (`avc1.64002a`).
    // Never claim support by probing a different AVC profile and then feeding the
    // decoder the High Profile transport; only acceleration preference may vary.
    for (const config of decoderConfigCandidates({codec: DEFAULT_CODEC, hardwareAcceleration: 'prefer-hardware', optimizeForLatency: true})) {
      try {
        const support = await VideoDecoder.isConfigSupported(config);
        if (support?.supported) return {supported: true, config: support.config ?? config, codec: DEFAULT_CODEC};
      } catch (_) {}
    }
    return {supported: false, reason: 'no supported High Profile Level 4.2 Annex-B H.264 VideoDecoder configuration'};'''
          if old_probe not in source:
              raise SystemExit('old browser source probe not found')
          source = source.replace(old_probe, new_probe, 1)

          old_manager = r'''class SourceWorkerManager {
  constructor() {
    this.worker = new Worker('/static/browser_source_worker.js?v=0.42.1', {type: 'module'});
    this.seq = 0; this.sourceSeq = 0; this.pending = new Map(); this.failed = false;
    this.worker.onmessage = e => {
      const m = e.data || {}, p = this.pending.get(m.requestId);
      if (!p) return;
      this.pending.delete(m.requestId);
      m.type === 'error' ? p.reject(new Error(m.error)) : p.resolve(m);
    };
    this.worker.onerror = e => {
      this.failed = true;
      const err = new Error(e.message || 'source decoder worker failed');
      for (const p of this.pending.values()) p.reject(err);
      this.pending.clear();
    };
  }
  request(message) {
    if (this.failed) return Promise.reject(new Error('source decoder worker unavailable'));
    const requestId = ++this.seq;
    return new Promise((resolve, reject) => {
      this.pending.set(requestId, {resolve, reject});
      this.worker.postMessage({...message, requestId});
    });
  }
  async open(url, config) {
    const sourceId = ++this.sourceSeq;
    const m = await this.request({type: 'open', sourceId, url, config});
    return new WorkerWebCodecsSceneSource(this, sourceId, m.fps, m.count, m.version);
  }
  close(sourceId) { if (!this.failed) this.worker.postMessage({type: 'close', sourceId}); }
}'''
          new_manager = r'''class SourceWorkerManager {
  constructor() {
    this.worker = new Worker('/static/browser_source_worker.js?v=0.42.1', {type: 'module'});
    this.seq = 0; this.sourceSeq = 0; this.pending = new Map(); this.failed = false; this.workerDecodeUnavailableReason = '';
    this.worker.onmessage = e => {
      const m = e.data || {}, p = this.pending.get(m.requestId);
      // A source may be closed while its worker frame is already in flight. The
      // transferred VideoFrame still belongs to this thread and must be closed.
      if (!p) { try { m.frame?.close?.(); } catch (_) {} return; }
      this.pending.delete(m.requestId);
      m.type === 'error' ? p.reject(new Error(m.error)) : p.resolve(m);
    };
    this.worker.onerror = e => {
      this.failed = true;
      const err = new Error(e.message || 'source decoder worker failed');
      for (const p of this.pending.values()) p.reject(err);
      this.pending.clear();
    };
  }
  request(message) {
    if (this.failed) return Promise.reject(new Error('source decoder worker unavailable'));
    const requestId = ++this.seq;
    return new Promise((resolve, reject) => {
      this.pending.set(requestId, {resolve, reject, sourceId: message.sourceId ?? null});
      try { this.worker.postMessage({...message, requestId}); }
      catch (error) { this.pending.delete(requestId); reject(error); }
    });
  }
  async open(url, config) {
    if (this.workerDecodeUnavailableReason) throw new Error(this.workerDecodeUnavailableReason);
    const sourceId = ++this.sourceSeq;
    try {
      const m = await this.request({type: 'open', sourceId, url, config});
      return new WorkerWebCodecsSceneSource(this, sourceId, m.fps, m.count, m.version);
    } catch (error) {
      const reason = String(error?.message || error);
      if (/no supported worker VideoDecoder configuration|Unsupported configuration/i.test(reason)) this.workerDecodeUnavailableReason = reason;
      throw error;
    }
  }
  close(sourceId) {
    const error = new Error('source decoder closed');
    for (const [requestId, p] of this.pending) {
      if (p.sourceId !== sourceId) continue;
      this.pending.delete(requestId); p.reject(error);
    }
    if (!this.failed) { try { this.worker.postMessage({type: 'close', sourceId}); } catch (_) {} }
  }
}'''
          if old_manager not in source:
              raise SystemExit('old SourceWorkerManager block not found')
          source = source.replace(old_manager, new_manager, 1)

