name: Fix WebGPU and WebCodecs

on:
  push:
    branches: [fix-webgpu-webcodecs]

permissions:
  contents: write

concurrency:
  group: fix-webgpu-webcodecs
  cancel-in-progress: true

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply browser rendering fixes
        run: python .github/scripts/fix_webgpu_webcodecs.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate browser and Python regressions
        run: |
          pytest -q
          python -m compileall -q src/tubeviz
          for file in \
            src/tubeviz/static/gui.js \
            src/tubeviz/static/visualizer.js \
            src/tubeviz/static/browser_gpu.js \
            src/tubeviz/static/browser_gpu_core.js \
            src/tubeviz/static/browser_gpu_worker.js \
            src/tubeviz/static/browser_source.js \
            src/tubeviz/static/browser_source_worker.js \
            src/tubeviz/static/browser_encode.js \
            src/tubeviz/static/browser_encode_worker.js; do
            node --check "$file"
          done

      - name: Commit validated source fix
        run: |
          git rm .github/scripts/fix_webgpu_webcodecs.py
          git rm .github/workflows/fix-webgpu-webcodecs.yml
          git add \
            pyproject.toml \
            CHANGELOG.md \
            .github/workflows/ci.yml \
            tests/test_browser_phase2.py \
            src/tubeviz/__init__.py \
            src/tubeviz/native_src/src/main.cpp \
            src/tubeviz/static/gui.html \
            src/tubeviz/static/index.html \
            src/tubeviz/static/browser_gpu_core.js \
            src/tubeviz/static/browser_gpu.js \
            src/tubeviz/static/browser_gpu_worker.js \
            src/tubeviz/static/browser_source.js \
            src/tubeviz/static/browser_source_worker.js \
            src/tubeviz/static/visualizer.js
          git config user.name "Scott Muller"
          git config user.email "scott@21h.io"
          git commit -m "Fix WebGPU and WebCodecs preview reliability"
          git push origin HEAD:fix-webgpu-webcodecs
