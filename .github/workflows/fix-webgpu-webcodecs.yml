    assert "/static/browser_gpu_core.js?v=0.42.1" in gpu
    assert "/static/browser_source_worker.js?v=0.42.1" in source
'''
          if 'test_webgpu_wgsl_mutation_and_webcodecs_lifecycle_regressions' in tests:
