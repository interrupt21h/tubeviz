          new_create = r'''  _createDecoder() {
    const callbacks = {
      output: frame => {
        const index = this.outputIndices.shift();
        const waiter = this.waiters.get(index);
        if (waiter) { this.waiters.delete(index); waiter.resolve(frame); }
