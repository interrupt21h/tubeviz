name: Fix README repository URL

"on":
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fix canonical clone URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          old = 'git clone <repo-url> tubeviz'
          new = 'git clone https://github.com/interrupt21h/tubeviz.git tubeviz'
          if old not in s:
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1))
          PY
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Fix canonical README repository URL'
          git push
