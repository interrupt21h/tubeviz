name: Release Tubeviz v0.44.1

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.44.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Prepare v0.44.1 metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = "0.44.1"
          release_date = "2026-08-28"

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          old = 'version = "0.44.0"'
          new = f'version = "{version}"'
          if old not in text:
              raise SystemExit(f"expected {old!r} in pyproject.toml")
          pyproject.write_text(text.replace(old, new, 1))

          citation = Path("CITATION.cff")
          text = citation.read_text()
          text = text.replace('version: "0.44.0"', f'version: "{version}"', 1)
          text = text.replace('date-released: "2026-08-28"', f'date-released: "{release_date}"', 1)
          old_author = 'authors:\n  - family-names: "Muller"\n    given-names: "Scott"\n\norcid: "https://orcid.org/0009-0001-2561-3255"'
          new_author = 'authors:\n  - family-names: "Muller"\n    given-names: "Scott"\n    orcid: "https://orcid.org/0009-0001-2561-3255"'
          if old_author in text:
              text = text.replace(old_author, new_author, 1)
          citation.write_text(text)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          heading = "# 0.44.1 — Rendering and preview reliability"
          entry = (
              "# 0.44.1 — Rendering and preview reliability\n\n"
              "## Preview and WebGPU\n\n"
              "- Prevent live WebGPU preview from accumulating stale GPU work when rendering cannot keep pace with playback; obsolete preview frames are dropped rather than queued behind the audio clock.\n"
              "- Decouple live preview timing from individual source-video decoder callbacks so source seeking, buffering, or decode stalls cannot freeze the entire visual preview.\n"
              "- Preserve responsive preview behavior under load with bounded in-flight GPU work while leaving deterministic offline/browser rendering and final native output unchanged.\n"
              "- Refresh browser module cache-bust identifiers and regression coverage for the updated preview path.\n\n"
              "## Visual effects and renderer parity\n\n"
              "- Replace the previous Cartesian ripple distortion with a true aspect-corrected radial displacement centered on the active visual target, producing concentric ripple/shockwave motion instead of dark swirl artifacts.\n"
              "- Separate vortex into a dedicated tangential rotational distortion rather than folding it into generic warp behavior.\n"
              "- Align ripple, vortex, beat-warp, chroma, RGB split, bloom, and related effect behavior across WebGPU, native GPU, native CPU, and Canvas2D fallback paths.\n"
              "- Apply ripple and vortex once at the native post-composite stage instead of repeatedly per source layer and again after composition.\n"
              "- Reduce excessive effect stacking with more conservative scheduling defaults, cooldowns, and occurrence gating so destructive effects act as musical punctuation rather than persistent wallpaper.\n\n"
              "## AI Director\n\n"
              "- Recover more reliably from truncated and malformed whole-song AI Director responses.\n"
              "- Retry incomplete responses with larger completion budgets and stricter complete-JSON guidance while keeping deterministic planning authoritative.\n"
              "- Reduce response size through sparse section patches over the deterministic baseline and improve diagnostics when a response cannot be recovered.\n\n"
              "## Project metadata and maintenance\n\n"
              "- Refresh README/demo media organization and project attribution/citation metadata.\n"
              "- Correct the CFF author ORCID placement and update release metadata for 0.44.1.\n"
              "- Expand regression coverage for preview timing, WebGPU backpressure, effect alignment, source decoding, and browser asset versioning.\n"
              "- Remove temporary implementation helpers used while aligning the effect renderers.\n\n"
          )
          if not text.startswith(heading):
              changelog.write_text(entry + text)
          PY

      - name: Install test and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build twine
          python -m pip check

      - name: Run regression suite
        run: python -m pytest -q

      - name: Build and validate distributions
        run: |
          rm -rf dist
          python -m build
          python -m twine check dist/*

      - name: Prepare release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("CHANGELOG.md").read_text()
          first_end = text.find("\n# ", 2)
          section = text if first_end < 0 else text[:first_end]
          Path("release-notes.md").write_text(
              "Tubeviz v0.44.1 is a focused reliability and rendering-quality fix release.\n\n" + section
          )
          PY

      - name: Commit release metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/release-v0.44.1.yml
          git add pyproject.toml CITATION.cff CHANGELOG.md .github/workflows/release-v0.44.1.yml
          git commit -m "Release v0.44.1"
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.44.1 dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Tubeviz v0.44.1 — Rendering and Preview Reliability" \
            --notes-file release-notes.md
