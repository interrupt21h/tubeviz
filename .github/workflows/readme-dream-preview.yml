name: Add Dream README preview

"on":
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add Dream sample preview
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text()
          preview = '![tubeviz sample video — Dream](dream.webp)'
          if preview in s:
              raise SystemExit(0)
          anchor = 'Complete videos produced with tubeviz:\n'
          if anchor not in s:
              raise SystemExit('Sample videos section anchor not found')
          replacement = anchor + '\n' + preview + '\n'
          p.write_text(s.replace(anchor, replacement, 1))
          PY
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Add Dream sample video preview to README'
          git push
