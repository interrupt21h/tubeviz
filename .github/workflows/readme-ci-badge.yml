name: Add README CI badge

"on":
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add-badge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add CI status badge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text()
          badge = '[![CI](https://github.com/interrupt21h/tubeviz/actions/workflows/ci.yml/badge.svg?branch=main)](https://github.com/interrupt21h/tubeviz/actions/workflows/ci.yml)'
          if badge in s:
              raise SystemExit(0)
          heading = '# tubeviz\n'
          if heading not in s:
              raise SystemExit('README heading not found')
          p.write_text(s.replace(heading, heading + '\n' + badge + '\n', 1))
          PY
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Add CI status badge to README'
          git push
