name: CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install tubeviz and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: CLI smoke test
        run: tubeviz --help >/dev/null

      - name: Run test suite
        run: |
          mkdir -p test-results
          python -m pytest -ra --strict-config --strict-markers \
            --junitxml="test-results/pytest-${{ matrix.python-version }}.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Python package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Validate Python and browser sources
        run: |
          python -m compileall -q src/tubeviz
          node --check src/tubeviz/static/gui.js

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/tubeviz-wheel-test
          /tmp/tubeviz-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/tubeviz-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/tubeviz-wheel-test/bin/python -m pip check
          /tmp/tubeviz-wheel-test/bin/tubeviz --help >/dev/null

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  native-build:
    name: Native renderer (${{ matrix.placebo }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        placebo: [OFF, ON]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            ffmpeg \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libplacebo-dev \
            libvulkan-dev

      - name: Configure native renderer
        run: |
          cmake \
            -S src/tubeviz/native_src \
            -B build/native-${{ matrix.placebo }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DTUBEVIZ_WITH_PLACEBO=${{ matrix.placebo }}

      - name: Build native renderer
        run: cmake --build build/native-${{ matrix.placebo }} --parallel 2

      - name: Native smoke tests
        run: |
          build/native-${{ matrix.placebo }}/tubeviz-native-render --version
          build/native-${{ matrix.placebo }}/tubeviz-native-render --help
