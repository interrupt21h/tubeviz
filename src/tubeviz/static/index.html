<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>tubeviz</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:system-ui,sans-serif; }
    #stage { position:fixed; inset:0; overflow:hidden; background:#000; }
    .decoder { position:absolute; width:1px; height:1px; left:-100px; top:-100px; opacity:0; pointer-events:none; }
    #video-fx,#gpu-fx,#canvas { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
    #video-fx { z-index:1; background:#000; }
    #gpu-fx { z-index:1; background:#000; display:none; }
    #canvas { z-index:2; }
    #hud { position:fixed; z-index:4; left:16px; bottom:16px; color:white; background:rgba(0,0,0,.48); padding:10px 12px; border-radius:8px; backdrop-filter:blur(10px); }
    #meta,#clip-meta { font-size:12px; opacity:.82; margin-top:6px; max-width:min(820px,80vw); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #clip-meta { opacity:.68; }
    audio { width:min(520px,80vw); }
    #fx-toggle { margin-top:7px; padding:4px 9px; border:1px solid rgba(255,255,255,.25); border-radius:6px; background:rgba(255,255,255,.08); color:#fff; cursor:pointer; }
    #fx-panel { display:none; margin-top:8px; grid-template-columns:auto minmax(120px,220px) 42px; gap:5px 9px; align-items:center; font-size:11px; }
    #fx-panel.open { display:grid; }
    #fx-panel input[type=range] { width:100%; }
    .fx-value { text-align:right; opacity:.75; font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
<div id="stage">
  <video id="decoder-0" class="decoder" muted playsinline preload="auto"></video>
  <video id="decoder-1" class="decoder" muted playsinline preload="auto"></video>
  <video id="decoder-2" class="decoder" muted playsinline preload="auto"></video>
  <video id="decoder-3" class="decoder" muted playsinline preload="auto"></video>
  <video id="decoder-4" class="decoder" muted playsinline preload="auto"></video>
  <video id="decoder-5" class="decoder" muted playsinline preload="auto"></video>
  <video id="decoder-6" class="decoder" muted playsinline preload="auto"></video>
  <video id="decoder-7" class="decoder" muted playsinline preload="auto"></video>
  <canvas id="video-fx"></canvas>
  <canvas id="gpu-fx"></canvas>
  <canvas id="canvas"></canvas>
</div>
<div id="hud">
  <audio id="audio" controls src="/audio"></audio>
  <div id="meta">Loading timeline…</div>
  <div id="clip-meta">Video renderer</div>
  <div id="render-meta" style="font-size:11px;opacity:.62;margin-top:4px">Renderer initialization…</div>
  <button id="fx-toggle" type="button">FX controls</button>
  <div id="fx-panel">
    <label for="fx-master">Master</label><input id="fx-master" type="range" min="0" max="2" step="0.05" value="1"><span id="fx-master-v" class="fx-value">1.00</span>
    <label for="fx-motion">Motion</label><input id="fx-motion" type="range" min="0" max="2" step="0.05" value="1"><span id="fx-motion-v" class="fx-value">1.00</span>
    <label for="fx-trails">Trails</label><input id="fx-trails" type="range" min="0" max="2" step="0.05" value="1"><span id="fx-trails-v" class="fx-value">1.00</span>
    <label for="fx-glitch">Glitch</label><input id="fx-glitch" type="range" min="0" max="2" step="0.05" value="1"><span id="fx-glitch-v" class="fx-value">1.00</span>
    <label for="fx-strobe">Strobe</label><input id="fx-strobe" type="range" min="0" max="2" step="0.05" value="1"><span id="fx-strobe-v" class="fx-value">1.00</span>
  </div>
</div>
<script type="module" src="/static/visualizer.js"></script>
</body>
</html>
